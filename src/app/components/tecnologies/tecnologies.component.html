<section class="skills-page section-container">
  <div class="section-header">
    <h1 class="section-title">{{ 'TECHNOLOGIES.TITLE' | transloco }}</h1>
    <p class="section-subtitle">{{ 'TECHNOLOGIES.SUBTITLE' | transloco }}</p>
  </div>

  <div class="skills-grid">
    <div class="skill-category" *ngFor="let category of tecnologies; let i = index"
         [style.animation-delay]="i * 0.1 + 's'">
      <div class="category-header">
        <div class="category-icon">
          <fa-icon [icon]="category.icon"></fa-icon>
        </div>
        <h3 class="category-title">{{ category.title }}</h3>
      </div>
      <div class="category-tags">
        <span class="skill-tag" *ngFor="let item of category.items; let j = index"
              [style.animation-delay]="(i * 0.1 + j * 0.03) + 's'"
              (click)="filterExperience(item.title)">
          {{ item.title }}
        </span>
      </div>
    </div>
  </div>
</section>
