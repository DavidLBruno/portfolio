<section class="skills-page section-container">
  <div class="section-header">
    <h1 class="section-title">{{ 'TECHNOLOGIES.TITLE' | transloco }}</h1>
    <p class="section-subtitle">{{ 'TECHNOLOGIES.SUBTITLE' | transloco }}</p>
  </div>

  <div class="skills-grid">
    @for (category of tecnologies; track category.key; let i = $index) {
      <div class="skill-category" [style.animation-delay]="i * 0.1 + 's'">
        <div class="category-header">
          <div class="category-icon">
            <fa-icon [icon]="category.icon"></fa-icon>
          </div>
          <h3 class="category-title">{{ category.key | transloco }}</h3>
        </div>
        <div class="category-tags">
          @for (item of category.items; track item.title; let j = $index) {
            <button
              type="button"
              class="skill-tag"
              [style.animation-delay]="i * 0.1 + j * 0.03 + 's'"
              [attr.title]="'TECHNOLOGIES.HINT' | transloco"
              (click)="filterExperience(item.title)"
            >
              {{ item.title }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</section>
