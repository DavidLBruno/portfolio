<nav class="main-nav" [class.scrolled]="scrolled" [class.menu-open]="hamburguer">
  <div class="nav-inner" [ngClass]="hamburguer ? 'open' : ''">
    <!-- Logo + Hamburger Row -->
    <div class="nav-brand">
      <img src="/assets/images/main.png" alt="Bruno David" routerLink="/" class="logo" />

      <div class="nav-actions-mobile">
        <!-- Theme toggle mobile -->
        <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
          <fa-icon [icon]="isDark ? iconSun : iconMoon"></fa-icon>
        </button>
        <!-- Settings mobile -->
        <button class="settings-btn" (click)="open()" aria-label="Settings">
          <fa-icon [icon]="iconGear"></fa-icon>
        </button>
        <!-- Hamburger -->
        <div class="hamburger" (click)="handleMenu()" [class.open]="hamburguer">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Navigation Links -->
    <div class="nav-links" [ngClass]="hamburguer ? 'open' : ''">
      <a *ngFor="let item of items"
         class="main-nav-link"
         [routerLink]="'/' + item.link"
         (click)="handleMenu()"
         [class.active]="'/' + item.link === routeActually || (item.link === '' && routeActually === '/')">
        {{ item.title | transloco }}
        <span class="link-indicator"></span>
      </a>
    </div>

    <!-- Desktop Actions -->
    <div class="nav-actions-desktop">
      <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
        <fa-icon [icon]="isDark ? iconSun : iconMoon"></fa-icon>
      </button>
      <button class="settings-btn" (click)="open()" aria-label="Settings">
        <fa-icon [icon]="iconGear"></fa-icon>
      </button>
    </div>
  </div>
</nav>
